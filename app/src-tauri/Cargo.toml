[package]
name = "daiku-app"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
publish = false

# Not part of the root workspace (ADR-0010): its own, so root cargo, CI and dist never see it.
[workspace]

[lib]
name = "daiku_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
daiku-core = { path = "../../crates/daiku-core" }
notify = "9"
notify-debouncer-full = "0.8"

[features]
measure = []

[dev-dependencies]
tempfile = "3"
