args = ["reopen", "spec", "--reason", "new requirement"]
workspace = "git-plan-architecture-approved"
git = true

[expect]
exit = 0
stdout = "1-auth-flow: spec = draft\n"
git_log = '''
daiku: 1-auth-flow: reopened spec (new requirement)

M	LOG.md
M	STATE.json
M	plan/specs/1-auth-flow/README.md
'''
changes = [
  "~ f LOG.md",
  "~ f STATE.json",
  "~ f plan/specs/1-auth-flow/README.md",
]
