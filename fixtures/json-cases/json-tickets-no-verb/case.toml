args = ["tickets", "--json"]
workspace = "plan-spec-ready"

[expect]
exit = 1
stdout = '''
{
  "schema": 1,
  "error": {
    "kind": "Usage",
    "message": "usage:\n  daiku tickets new <type> <title> [--parent <id>] [--repo <name>] [--depends <id,id>] [--requirements <id,id>] [--inbox]\n                                           create a ticket in the active plan change, or with --inbox (or no open plan change) an N- task in build/tickets/\n  daiku tickets pull <file>                record a ticket fetched from a PM tool as X-<pm-id> in build/tickets/\n  daiku tickets check                      validate every ticket\n  daiku tickets status                     list tickets by draft, ready, published and drifted\n  daiku tickets list                       list every ticket with its fields, from every plan and the inbox\n  daiku tickets order                      list tickets in publish order\n  daiku tickets ready <id>... | --all [--force]\n                                           ready draft tickets once breakdown is approved\n  daiku tickets mark-published <id> --external <tool>=<item-id> [--force]\n                                           record a PM tool's id and freeze the ticket\n  daiku tickets unfreeze <id> --reason <r> clear a ticket's freeze"
  }
}
'''
