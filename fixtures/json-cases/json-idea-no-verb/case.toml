args = ["idea", "--json"]
workspace = "ideas"

[expect]
exit = 1
stdout = '''
{
  "schema": 1,
  "error": {
    "kind": "Usage",
    "message": "usage:\n  daiku idea new <title>                   create an idea in ideas/, from the summary template\n  daiku idea list                          list ideas with their status\n  daiku idea show <id>                     print an idea's summary and status\n  daiku idea park <id> --reason <r>        set an open idea aside, with a reason\n  daiku idea drop <id> --reason <r>        drop an open idea, with a reason (the folder stays)\n  daiku idea reopen <id> --reason <r>      reopen a parked or dropped idea, with a reason\n  daiku idea promote <id> --title <t> [--repo <name|path>]... [--rev <r>]\n                                           start a change from an idea"
  }
}
'''
