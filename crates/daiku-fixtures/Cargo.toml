[package]
name = "daiku-fixtures"
description = "Runs a daiku binary against golden fixture cases"
publish = false
default-run = "daiku-fixtures"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
regex = "1.13.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
similar = "3.2.1"
tempfile = "3.27.0"
toml = "1.2.1"
