name: release

# Pushing a v* tag publishes the release: the tree is checked as CI checks it,
# then a GitHub release is created with generated notes (ported from zumen).
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Check format
        run: |
          gofmt -l . > "$RUNNER_TEMP/gofmt.txt"
          if [ -s "$RUNNER_TEMP/gofmt.txt" ]; then
            echo "Files not formatted:"
            cat "$RUNNER_TEMP/gofmt.txt"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Check the scaffold
        run: go run ./cmd/daiku check

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
