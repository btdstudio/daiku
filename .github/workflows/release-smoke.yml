name: Release smoke

# Checks a published release: on each target's own runner, downloads the archive with
# the workflow's token, checks its checksum, and runs `daiku version` and `daiku init`
# (scripts/release-smoke.py). The repo is private until it merges into btdstudio/daiku,
# and dist's install scripts download without logging in, so this job tests the archives
# the token can download; the installers are exercised once the repo is public (S-0012).
#
# `workflow_run` starts it when the Release workflow (dist's generated release.yml)
# finishes. The release job can't start it with `on: release`, because GitHub starts no
# workflow from an event made with the default token. Run it by hand for any tag with
# `gh workflow run release-smoke.yml -f tag=v0.3.0-alpha.1`.

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to check, such as v0.3.0-alpha.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    # By hand always; automatically only after a Release run for a tag push succeeded.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}
    name: smoke (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            archive: tar.xz
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            archive: tar.xz
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            archive: tar.xz
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            archive: zip
    env:
      # For a tag push, a workflow_run's head_branch is the tag's name.
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check the tag
        run: |
          case "$TAG" in
            v[0-9]*) echo "Checking release $TAG for ${{ matrix.target }}" ;;
            *) echo "::error::'$TAG' isn't a release tag"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          # The job runs the downloaded binary, so nothing here should leave a credential
          # on disk for it to find.
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Download the archive and its checksum
        env:
          # Only this step gets the token. The step that runs the downloaded binary
          # doesn't, and the script strips credentials from the binary's environment too.
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -D dl -p "daiku-cli-${{ matrix.target }}.${{ matrix.archive }}*"
      - name: Check, unpack and run it
        run: python scripts/release-smoke.py dl "$TAG" "${{ matrix.target }}"
