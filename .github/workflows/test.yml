name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check format
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...

  # The built binary, as a person gets it: the scaffold checks clean, init
  # writes a workspace, and nothing the build or tests make is left in the tree.
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go build -o "$RUNNER_TEMP/daiku" ./cmd/daiku
      - run: '"$RUNNER_TEMP/daiku" check'
      - run: '"$RUNNER_TEMP/daiku" init "$RUNNER_TEMP/daiku-smoke" --no-git'
      - run: |
          for f in AGENTS.md CLAUDE.md STATE.json REPOS.json sync.md .daiku/settings.json .daiku/manifest.json; do
            test -f "$RUNNER_TEMP/daiku-smoke/$f" || { echo "init didn't write $f"; exit 1; }
          done
      - run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "the build left the tree dirty — a generated file is not gitignored:"
            git status --porcelain
            exit 1
          fi
